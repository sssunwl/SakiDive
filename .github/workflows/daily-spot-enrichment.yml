name: Saki 每日潛點查證

on:
  schedule:
    - cron: "30 1 * * *" # 10:30 JST
  workflow_dispatch:
    inputs:
      spot_override:
        description: "選填：- [ ] id｜名稱｜國家｜area（不打勾佇列）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: saki-daily-spot-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: 查證潛點
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_SAKI: ${{ secrets.DISCORD_WEBHOOK_SAKI }}
          SPOT_OVERRIDE: ${{ inputs.spot_override }}
        shell: bash
        run: |
          args=()
          if [[ -n "${SPOT_OVERRIDE}" ]]; then
            args+=(--spot-override "${SPOT_OVERRIDE}")
          fi
          set +e
          python3 _pipeline/enrich_spots.py "${args[@]}" 2>&1 | tee /tmp/enrich-spots.log
          code=${PIPESTATUS[0]}
          set -e
          if [[ "${code}" -ne 0 ]]; then
            echo "::warning::潛點查證失敗（exit ${code}），詳見 Summary"
            {
              echo "## ❌ 每日潛點查證失敗"
              echo "時間：$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
              echo "退出碼：${code}"
              echo '```'
              tail -n 40 /tmp/enrich-spots.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          # GitHub 失敗通知信無法單獨關閉；以 Summary 留下錯誤。
          exit 0

      - name: 保存成功潛點（部分失敗仍保存）
        shell: bash
        run: |
          mkdir -p data/spots
          git add -- data/spots data/spot_queue.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "每日潛點查證 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          git push origin main
