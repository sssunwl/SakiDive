name: Saki 每日內容豐富化

on:
  schedule:
    # 每天 01:00 UTC = 日本時間 10:00
    # 2026-09-05 因 run-gemini-cli 搜尋工具卡死而停用，
    # 2026-09-07 改用 _pipeline/enrich_content.py 單次 API grounding 後恢復。
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      task_override:
        description: 測試用題目（選填；有值時不從內容路線圖選題）
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: saki-daily-content-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 設定提交身分
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 研究並寫入今日內容
        id: enrich_content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_OVERRIDE: ${{ inputs.task_override }}
        shell: bash
        run: |
          args=()
          if [[ -n "${TASK_OVERRIDE}" ]]; then
            args+=(--task "${TASK_OVERRIDE}")
          fi
          python3 _pipeline/enrich_content.py "${args[@]}"

      - name: 顯示 Gemini 執行後狀態
        if: always()
        shell: bash
        run: |
          echo "git status --porcelain"
          git status --porcelain
          echo "git diff --stat"
          git diff --stat

      - name: 標記完成並提交
        if: steps.enrich_content.outcome == 'success'
        env:
          TASK: ${{ steps.enrich_content.outputs.task }}
        shell: bash
        run: |
          # 只看內容路徑，避免暫存雜物被誤認為產出。
          CONTENT_PATHS=(01_潛水點 02_課程證照 03_技術裝備)
          if [[ -z "$(git status --porcelain -- "${CONTENT_PATHS[@]}")" ]]; then
            echo "::notice::本次沒有產出內容"
            exit 0
          fi

          summary="$(python3 -c 'import os; print(os.environ["TASK"][:30])')"
          # 明確列出路徑，不用 -A，以免暫存檔進版控。
          git add -- "${CONTENT_PATHS[@]}" 內容路線圖.md
          if git diff --cached --quiet; then
            echo "::notice::沒有可提交的內容變更"
            exit 0
          fi
          git commit -m "每日內容豐富: ${summary}"
          git push origin main
