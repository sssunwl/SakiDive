name: Saki 每日內容豐富化

on:
  # 2026-09-05：停用排程，避免 Gemini API 額度不足時持續寄送失敗通知。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saki-daily-content-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 設定提交身分
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 檢查 Gemini API 額度
        id: gemini_preflight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          response_body="$(mktemp)"
          http_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output "${response_body}" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --header "x-goog-api-key: ${GEMINI_API_KEY}" \
              --data '{"contents":[{"parts":[{"text":"ping"}]}],"generationConfig":{"maxOutputTokens":1}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
          )"

          case "${http_status}" in
            200)
              echo "run_gemini=true" >> "${GITHUB_OUTPUT}"
              ;;
            429)
              echo "::notice::Gemini 額度不足，本次跳過"
              echo "run_gemini=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              # 回應 body 不含金鑰，可安全印出以便診斷（403 權限、404 找不到模型、400 金鑰無效）。
              echo "::error::Gemini preflight 失敗（HTTP ${http_status}）"
              echo "API 回應："
              head -c 1000 "${response_body}"
              echo
              exit 1
              ;;
          esac

      - name: 研究並豐富今日內容
        if: steps.gemini_preflight.outputs.run_gemini == 'true'
        continue-on-error: false
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          # GitHub runner 每次都是乾淨工作目錄；允許 headless Gemini CLI 在此 repo 內寫入。
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-2.5-flash
          prompt: >-
            讀取並完整執行 .github/prompts/daily-content-enrichment.md。
            這是排程任務，請直接完成工作，不要只提出建議。
